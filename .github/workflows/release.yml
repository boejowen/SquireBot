name: release

# SquireBot watcher release pipeline.
#
# Phase 13 (WATCH-09 / D-2): the watcher was re-targeted from Google Sheets to
# the v2.0 backend ingest API. The Google OAuth/PKCE/Sheets/Drive-Picker stack
# was deleted and the build bakes in NO Google secret — the OAuth ldflags + the
# oauth-config.json materialize step + the consent-screen PRODUCTION gate were
# all removed from this workflow.
#
# Architecture: LINEAR explicit-step workflow. CI does NOT invoke goreleaser
# (Pitfall F: a goreleaser-driven CI step would dual-build the binary and
# complicate the manifest emission). The .goreleaser.yaml at the repo root
# exists for local snapshot builds only.
#
# What this workflow does (in order):
#   1. Builds dist/squirebot.exe with -ldflags injecting ONLY Version (the
#      watcher build version, sent in every ingest POST + the User-Agent so the
#      backend's 426 min-version gate can read it) and BackendBaseURL (the
#      canonical host; the hardcoded build_constants.go default already covers
#      it, so the ldflag is belt-and-braces).
#   2. Installs NSIS (verifies version >= 3.10) and runs makensis to produce
#      dist/SquireBot-Setup-<version>.exe.
#   3. Computes SHA-256 of BOTH the installer and the bare binary; writes
#      dist/latest.json — the manifest the in-app auto-updater (OPS-04) consumes.
#      Schema includes binary_url + binary_sha256 (the auto-updater downloads +
#      SHA-256-verifies the bare binary before the startup swap) in addition to
#      installer_url + installer_sha256.
#   4. Uploads three artifacts (installer .exe, bare squirebot.exe, latest.json).
#      On tag push, also creates a GitHub Release using the canonical action.
#
# The binary still ships unsigned (D-13). SignPath OSS code-signing will land as
# an additional workflow step between makensis and Compute SHA-256 — not via
# goreleaser.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.1.0) -- omit the leading 'v'."
        required: true

permissions:
  contents: write   # required for creating a GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - name: Install NSIS (>= 3.10)
        shell: pwsh
        run: |
          # `windows-latest` ships with chocolatey preinstalled. Try a pinned
          # 3.10 install first; fall back to whatever version choco serves.
          choco install nsis --no-progress --version=3.10 -y `
            ; if ($LASTEXITCODE -ne 0) { choco install nsis --no-progress -y }

      - name: Verify NSIS version
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            Write-Error "makensis.exe not found in either Program Files location after choco install nsis"
            exit 1
          }
          $v = & $makensis /VERSION
          Write-Host "NSIS version: $v"
          if (-not ($v -match 'v3\.(1[0-9]|[2-9][0-9])')) {
            Write-Error "NSIS version $v is < 3.10 -- aborting (RESEARCH.md section 1 minimum requirement)"
            exit 1
          }
          "MAKENSIS=$makensis" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not derive version from tag or workflow_dispatch input"
            exit 1
          }
          # NSIS VIProductVersion requires strictly numeric X.X.X.X format and
          # rejects prerelease suffixes like '-rc1'. Strip the suffix and pad
          # to 4 parts for the installer's VIProductVersion. Display strings
          # (FileVersion, ProductVersion, BrandingText, OutFile, DisplayVersion)
          # keep the full $version including any '-rc1' / '-beta.N' suffix.
          $numeric = $version -replace '-.*$', ''
          $parts = $numeric.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $numericVersion = $parts[0..3] -join '.'
          "version=$version" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "numeric_version=$numericVersion" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          Write-Host "Building version: $version (NSIS VIProductVersion: $numericVersion)"

      - name: Build bare squirebot.exe (pre-NSIS, pre-manifest)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          # Phase 13 (D-2): NO Google secret is baked in. Only Version (the 426
          # gate vector) and BackendBaseURL (belt-and-braces; the hardcoded
          # build_constants.go default is already https://api.squirebot.quest)
          # are stamped via -ldflags.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-H=windowsgui -s -w " +
                     "-X main.Version=${{ steps.ver.outputs.version }} " +
                     "-X main.BackendBaseURL=https://api.squirebot.quest"
          go build -ldflags="$ldflags" -o dist/squirebot.exe ./cmd/squirebot
          Get-Item dist/squirebot.exe | Select-Object Name, Length

      - name: Build NSIS installer (pre-manifest)
        shell: pwsh
        run: |
          & $env:MAKENSIS /V2 /DAPPVERSION=${{ steps.ver.outputs.version }} /DAPPVERSIONNUMERIC=${{ steps.ver.outputs.numeric_version }} installer/squirebot.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-Item dist/SquireBot-Setup-${{ steps.ver.outputs.version }}.exe | Select-Object Name, Length

      - name: Stage versionless installer alias (for README permalink)
        shell: pwsh
        run: |
          # Copy the versioned installer to a versionless filename so the
          # README's `releases/latest/download/SquireBot-Setup.exe` URL
          # resolves on every new non-prerelease tag without needing a doc
          # update. The versioned asset (SquireBot-Setup-<version>.exe)
          # is preserved alongside it for download-history clarity. Both
          # are byte-identical; the bytes hashed for the manifest's
          # installer_sha256 are the versioned file (which is also what
          # the auto-updater downloads via installer_url).
          Copy-Item dist/SquireBot-Setup-${{ steps.ver.outputs.version }}.exe dist/SquireBot-Setup.exe -Force
          Get-Item dist/SquireBot-Setup.exe | Select-Object Name, Length

      # TODO(SignPath OSS): wire SignPath signing here, between makensis
      # and Compute SHA-256 sums.
      #
      # Status: SignPath Foundation OSS sponsorship application is
      # tracked in docs/signpath-application.md. Until approved, both
      # artifacts ship UNSIGNED and the SmartScreen walkthrough at
      # docs/smartscreen-walkthrough.md is the documented install path.
      #
      # When approved, replace this comment block with the SignPath
      # GitHub Action invocation per
      # https://about.signpath.io/documentation/build-systems/github-actions/.
      # The step MUST sign BOTH:
      #   - dist/SquireBot-Setup-<version>.exe (NSIS installer)
      #   - dist/squirebot.exe (bare binary, consumed by auto-updater)
      # BEFORE the next step (Compute SHA-256 sums) runs, so the
      # manifest hashes the SIGNED bytes -- the in-app auto-updater
      # verifies SHA-256 against whatever shipped, signed or not.
      #
      # Required repo secret (add at
      # https://github.com/boejowen/SquireBot/settings/secrets/actions):
      #   - SIGNPATH_API_TOKEN
      # (Plus any project/org/policy slugs SignPath provides during
      # onboarding -- those are non-secret and can live inline.)
      #
      # After enabling, also flip `signed: false` to `signed: true` in
      # the "Write latest.json" step's manifest payload below.
      #
      # DO NOT add a `signs:` block to .goreleaser.yaml -- CI does not
      # invoke goreleaser (LINEAR explicit-step workflow per Plan 02-08).
      # Signing belongs here, in the workflow, not in goreleaser config.
      #
      # NEVER replace this with EV cert acquisition -- per
      # .planning/phases/02-watcher-robustness-schema-lock/02-CONTEXT.md
      # Microsoft removed EV's instant-SmartScreen-reputation perk in
      # March 2024; EV cert is value destruction at our scale.

      - name: Compute SHA-256 sums (installer + bare binary)
        id: hashes
        shell: pwsh
        run: |
          $installerPath = "dist/SquireBot-Setup-${{ steps.ver.outputs.version }}.exe"
          $binaryPath    = "dist/squirebot.exe"
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $binaryHash    = (Get-FileHash $binaryPath    -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer SHA-256: $installerHash"
          Write-Host "Binary    SHA-256: $binaryHash"
          "installer_sha256=$installerHash" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "binary_sha256=$binaryHash"       | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Write latest.json (auto-updater manifest with both URLs)
        shell: pwsh
        run: |
          # Manifest schema (consumed by the OPS-04 auto-updater):
          #   { version, installer_url, installer_sha256, binary_url,
          #     binary_sha256, released_at, phase, signed }
          # binary_url is the bare squirebot.exe asset that the in-app
          # auto-updater downloads + SHA-256-verifies before the startup
          # swap. Keep this schema in lockstep with internal/update/manifest.go.
          # (phase is informational only — left at 2 to avoid churning the
          # manifest contract; the auto-updater ignores it.)
          $version = "${{ steps.ver.outputs.version }}"
          $owner   = "${{ github.repository_owner }}"
          $repo    = "${{ github.event.repository.name }}"
          $manifest = @{
            version          = $version
            installer_url    = "https://github.com/$owner/$repo/releases/download/v$version/SquireBot-Setup-$version.exe"
            installer_sha256 = "${{ steps.hashes.outputs.installer_sha256 }}"
            binary_url       = "https://github.com/$owner/$repo/releases/download/v$version/squirebot.exe"
            binary_sha256    = "${{ steps.hashes.outputs.binary_sha256 }}"
            released_at      = (Get-Date).ToUniversalTime().ToString("o")
            phase            = 2
            signed           = $false
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 -NoNewline dist/latest.json
          Get-Content dist/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: squirebot-release
          path: |
            dist/SquireBot-Setup*.exe
            dist/squirebot.exe
            dist/latest.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Auto-mark prerelease for any tag containing '-' (rc, beta, alpha, etc.)
          # so prereleases don't show up as "Latest" on the repo home page.
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          # KNOWN BUG (2026-05-02): when re-tagging an existing release, this
          # action replaces ASSETS but does NOT overwrite BODY. So the
          # release body's hash lines drift from reality across re-tags.
          # Workaround: post-publish `gh release edit --notes` to refresh body.
          # Mitigation: latest.json is regenerated each run with current SHAs,
          # so the auto-updater is unaffected -- only humans reading the release
          # page see the stale text. Followup: switch to gh CLI commands for
          # release create/edit, or set update_existing_release flag if added.
          files: |
            dist/SquireBot-Setup*.exe
            dist/squirebot.exe
            dist/latest.json
          body: |
            SquireBot ${{ steps.ver.outputs.version }} -- v2.0 backend watcher (unsigned).

            This is the re-targeted watcher: it uploads your inventory/spellbook
            to the SquireBot backend (no Google account, no browser sign-in).
            On first launch it asks for your guild code via a native dialog.

            **Install:** download `SquireBot-Setup-${{ steps.ver.outputs.version }}.exe`,
            double-click, walk through the SmartScreen "More info -> Run anyway"
            wall (D-13: still ships unsigned; SignPath OSS pending). NSIS wizard
            installs to `%LOCALAPPDATA%\Programs\SquireBot\` with no UAC prompt.

            **Auto-updater asset:** `squirebot.exe` (bare binary) is consumed by
            the in-app auto-updater (OPS-04) via `binary_url` in `latest.json`.
            End users do NOT download this file directly.

            See [docs/build-and-install.md](https://github.com/${{ github.repository }}/blob/main/docs/build-and-install.md)
            for the full local-build + smoke instructions.

            SHA-256 sums:
            - Installer: `${{ steps.hashes.outputs.installer_sha256 }}`
            - Bare binary: `${{ steps.hashes.outputs.binary_sha256 }}`
