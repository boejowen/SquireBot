<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SquireBot Setup — All Set</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 640px; margin: 4em auto; padding: 0 1.5em; color: #222;
         text-align: center; }
  h1 { font-size: 2em; margin-bottom: 0.2em; }
  .check { font-size: 4em; color: #2e7d32; line-height: 1; }
  p { color: #555; }
  .step-pill { display: inline-block; padding: 2px 10px; border-radius: 12px;
               background: #e6f0ff; color: #003580; font-size: 0.8em; margin-bottom: 1em; }
</style>
</head>
<body>
<div class="step-pill">Step 4 of 4</div>
<div class="check">&#10003;</div>
<h1>You're all set</h1>
<p>
  SquireBot is now watching your EverQuest folder. Look for the
  <strong>SquireBot</strong> icon in the Windows tray.
</p>
<p style="color:#888; font-size:0.85em">
  This window will close itself in a moment.
</p>

<script>
  // D-06: minimise to tray after a short pause. The wizard server graceful-
  // shuts-down on this POST; the loopback listener tears down with it.
  setTimeout(function () {
    fetch('/wizard/shutdown', {method:'POST'})
      .catch(function () { /* listener gone — that's the point */ });
  }, 3000);
</script>
</body>
</html>
