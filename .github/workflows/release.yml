name: release

# Phase 2 release pipeline (Plan 02-08).
#
# Architecture: LINEAR explicit-step workflow. CI does NOT invoke
# goreleaser (Pitfall F: a goreleaser-driven CI step would (a) dual-build
# the binary, (b) complicate the AUTH-03 PRODUCTION gate's interaction
# with goreleaser's declarative pipeline, and (c) risk clobbering the
# gate during a future scaffold-regeneration). The .goreleaser.yaml at
# the repo root exists for local snapshot builds only.
#
# What this workflow does (in order):
#   1. Materialises oauth-config.json from the OAUTH_CONFIG_JSON repo
#      secret. The local file is gitignored so CI must rebuild it.
#   2. Refuses to build if consent_screen_status != "PRODUCTION" --
#      AUTH-03 enforcement at the CI layer (Pitfall #1: Testing-mode
#      refresh tokens silently expire after 7 days, so a non-Production
#      release is always a bug). This gate is preserved VERBATIM from
#      Phase 1; do NOT remove it without a phase-level decision.
#   3. Builds dist/squirebot.exe with -ldflags injecting the five
#      build-time vars (OAuthClientID, OAuthClientSecret, PickerAPIKey,
#      GCPProjectNumber, Version). OAuthClientSecret is required by
#      Google's token endpoint even for desktop PKCE flows -- see
#      docs/build-and-install.md "About the client secret".
#   4. Installs NSIS (verifies version >= 3.10) and runs makensis to
#      produce dist/SquireBot-Setup-<version>.exe.
#   5. Computes SHA-256 of BOTH the installer and the bare binary;
#      writes dist/latest.json -- the Phase 2 manifest the auto-updater
#      (Plan 02-06 / OPS-04) will consume. Schema includes binary_url +
#      binary_sha256 in addition to installer_url + installer_sha256.
#   6. Uploads three artifacts (installer .exe, bare squirebot.exe,
#      latest.json). On tag push, also creates a GitHub Release using
#      the canonical action.
#
# Phase 2 still ships unsigned (D-13 inherited from Phase 1). SignPath
# OSS code-signing (Plan 02-09) will land as an additional workflow
# step between makensis and Compute SHA-256 -- not via goreleaser.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.1.0) -- omit the leading 'v'."
        required: true

permissions:
  contents: write   # required for creating a GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Materialise oauth-config.json from secret
        shell: pwsh
        env:
          OAUTH_CONFIG_JSON: ${{ secrets.OAUTH_CONFIG_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OAUTH_CONFIG_JSON)) {
            Write-Error "Secret OAUTH_CONFIG_JSON is empty. Populate it from .planning/phases/01-end-to-end-thin-slice/oauth-config.json. See docs/oauth-setup.md for the runbook."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path .planning/phases/01-end-to-end-thin-slice | Out-Null
          $env:OAUTH_CONFIG_JSON | Out-File -Encoding utf8 -NoNewline .planning/phases/01-end-to-end-thin-slice/oauth-config.json

      - name: Install NSIS (>= 3.10)
        shell: pwsh
        run: |
          # `windows-latest` ships with chocolatey preinstalled. Try a pinned
          # 3.10 install first; fall back to whatever version choco serves.
          choco install nsis --no-progress --version=3.10 -y `
            ; if ($LASTEXITCODE -ne 0) { choco install nsis --no-progress -y }

      - name: Verify NSIS version
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            Write-Error "makensis.exe not found in either Program Files location after choco install nsis"
            exit 1
          }
          $v = & $makensis /VERSION
          Write-Host "NSIS version: $v"
          if (-not ($v -match 'v3\.(1[0-9]|[2-9][0-9])')) {
            Write-Error "NSIS version $v is < 3.10 -- aborting (RESEARCH.md section 1 minimum requirement)"
            exit 1
          }
          "MAKENSIS=$makensis" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not derive version from tag or workflow_dispatch input"
            exit 1
          }
          "version=$version" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Load OAuth constants from oauth-config.json (AUTH-03 gate)
        id: oauth
        shell: pwsh
        run: |
          $cfg = Get-Content .planning/phases/01-end-to-end-thin-slice/oauth-config.json -Raw | ConvertFrom-Json
          # AUTH-03 / Pitfall #1: Testing-mode refresh tokens silently expire
          # after 7 days. Refuse to ship a release built against a non-
          # Production consent screen.
          if ($cfg.consent_screen_status -ne "PRODUCTION") {
            Write-Error "oauth-config.json consent_screen_status is '$($cfg.consent_screen_status)' -- must be 'PRODUCTION' before release per AUTH-03 / Plan 02. Update the OAUTH_CONFIG_JSON secret after flipping the consent screen."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($cfg.oauth_client_id))     { Write-Error "oauth_client_id missing -- see docs/oauth-setup.md";     exit 1 }
          if ([string]::IsNullOrWhiteSpace($cfg.oauth_client_secret)) { Write-Error "oauth_client_secret missing -- Google's token endpoint requires this for desktop PKCE clients; see docs/build-and-install.md 'About the client secret'"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($cfg.picker_api_key))      { Write-Error "picker_api_key missing -- see docs/oauth-setup.md";     exit 1 }
          if ([string]::IsNullOrWhiteSpace($cfg.gcp_project_number))  { Write-Error "gcp_project_number missing -- see docs/oauth-setup.md"; exit 1 }
          "client_id=$($cfg.oauth_client_id)"          | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "client_secret=$($cfg.oauth_client_secret)"  | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "api_key=$($cfg.picker_api_key)"             | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "project_num=$($cfg.gcp_project_number)"     | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Build bare squirebot.exe (pre-NSIS, pre-manifest)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          OAUTH_CLIENT_ID:     ${{ steps.oauth.outputs.client_id }}
          OAUTH_CLIENT_SECRET: ${{ steps.oauth.outputs.client_secret }}
          PICKER_API_KEY:      ${{ steps.oauth.outputs.api_key }}
          GCP_PROJECT_NUMBER:  ${{ steps.oauth.outputs.project_num }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-H=windowsgui -s -w " +
                     "-X main.OAuthClientID=$env:OAUTH_CLIENT_ID " +
                     "-X main.OAuthClientSecret=$env:OAUTH_CLIENT_SECRET " +
                     "-X main.PickerAPIKey=$env:PICKER_API_KEY " +
                     "-X main.GCPProjectNumber=$env:GCP_PROJECT_NUMBER " +
                     "-X main.Version=${{ steps.ver.outputs.version }}"
          go build -ldflags="$ldflags" -o dist/squirebot.exe ./cmd/squirebot
          Get-Item dist/squirebot.exe | Select-Object Name, Length

      - name: Build NSIS installer (pre-manifest)
        shell: pwsh
        run: |
          & $env:MAKENSIS /V2 /DAPPVERSION=${{ steps.ver.outputs.version }} installer/squirebot.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-Item dist/SquireBot-Setup-${{ steps.ver.outputs.version }}.exe | Select-Object Name, Length

      - name: Compute SHA-256 sums (installer + bare binary)
        id: hashes
        shell: pwsh
        run: |
          $installerPath = "dist/SquireBot-Setup-${{ steps.ver.outputs.version }}.exe"
          $binaryPath    = "dist/squirebot.exe"
          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $binaryHash    = (Get-FileHash $binaryPath    -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer SHA-256: $installerHash"
          Write-Host "Binary    SHA-256: $binaryHash"
          "installer_sha256=$installerHash" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "binary_sha256=$binaryHash"       | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT

      - name: Write latest.json (Phase 2 manifest with both URLs)
        shell: pwsh
        run: |
          # Phase 2 manifest schema (consumed by Plan 02-06 auto-updater):
          #   { version, installer_url, installer_sha256, binary_url,
          #     binary_sha256, released_at, phase, signed }
          # binary_url is the bare squirebot.exe asset that the in-app
          # auto-updater downloads + SHA-256-verifies before the startup
          # swap. Keep this schema in lockstep with internal/update/manifest.go.
          $version = "${{ steps.ver.outputs.version }}"
          $owner   = "${{ github.repository_owner }}"
          $repo    = "${{ github.event.repository.name }}"
          $manifest = @{
            version          = $version
            installer_url    = "https://github.com/$owner/$repo/releases/download/v$version/SquireBot-Setup-$version.exe"
            installer_sha256 = "${{ steps.hashes.outputs.installer_sha256 }}"
            binary_url       = "https://github.com/$owner/$repo/releases/download/v$version/squirebot.exe"
            binary_sha256    = "${{ steps.hashes.outputs.binary_sha256 }}"
            released_at      = (Get-Date).ToUniversalTime().ToString("o")
            phase            = 2
            signed           = $false
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 -NoNewline dist/latest.json
          Get-Content dist/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirebot-release
          path: |
            dist/SquireBot-Setup-*.exe
            dist/squirebot.exe
            dist/latest.json
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SquireBot-Setup-*.exe
            dist/squirebot.exe
            dist/latest.json
          body: |
            SquireBot ${{ steps.ver.outputs.version }} -- Phase 2 unsigned release.

            **Install:** download `SquireBot-Setup-${{ steps.ver.outputs.version }}.exe`,
            double-click, walk through the SmartScreen "More info -> Run anyway"
            wall (D-13: Phase 2 still ships unsigned; SignPath OSS pending).
            NSIS wizard installs to `%LOCALAPPDATA%\Programs\SquireBot\` with
            no UAC prompt.

            **Auto-updater asset:** `squirebot.exe` (bare binary, ~17 MB) is
            consumed by the in-app auto-updater (OPS-04 / Plan 02-06) via
            `binary_url` in `latest.json`. End users do NOT download this
            file directly.

            See [docs/build-and-install.md](https://github.com/${{ github.repository }}/blob/main/docs/build-and-install.md)
            for the full local-build + smoke instructions.

            SHA-256 sums:
            - Installer: `${{ steps.hashes.outputs.installer_sha256 }}`
            - Bare binary: `${{ steps.hashes.outputs.binary_sha256 }}`
